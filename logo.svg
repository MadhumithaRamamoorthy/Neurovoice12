<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Hexagon (Matte Charcoal) -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" fill="#12151c" stroke="url(#nexusGrad)" stroke-width="2.5" />
  <!-- Neural Synapse Connections -->
  <line x1="24" y1="12" x2="14" y2="22" stroke="#34d399" stroke-width="1.8" stroke-opacity="0.9" />
  <line x1="24" y1="12" x2="34" y2="22" stroke="#34d399" stroke-width="1.8" stroke-opacity="0.9" />
  <line x1="14" y1="22" x2="24" y2="34" stroke="#fbbf24" stroke-width="1.8" stroke-opacity="0.9" />
  <line x1="34" y1="22" x2="24" y2="34" stroke="#fbbf24" stroke-width="1.8" stroke-opacity="0.9" />
  <line x1="14" y1="22" x2="34" y2="22" stroke="#10b981" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.7" />
  <line x1="24" y1="12" x2="24" y2="34" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Synaptic Nodes -->
  <circle cx="24" cy="12" r="3.5" fill="#34d399" filter="url(#glow)" />
  <circle cx="14" cy="22" r="3" fill="#10b981" />
  <circle cx="34" cy="22" r="3" fill="#fbbf24" />
  <circle cx="24" cy="34" r="3.5" fill="#a78bfa" filter="url(#glow)" />
  <circle cx="24" cy="22" r="2.5" fill="#ffffff" />
</svg>
